<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event Ticketing Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5fa; --panel:#fff; --ink:#1d1b26; --muted:#6b6880; --line:#e6e3ef;
  --brand:#6a4fc7; --brand-ink:#fff; --brand-soft:#efeafd;
  --ok:#1f9d63; --ok-soft:#e3f6ec; --warn:#b7791f; --warn-soft:#fdf3e1; --bad:#d64545; --bad-soft:#fde8e8;
  --shadow:0 1px 2px rgba(20,16,40,.06),0 4px 16px rgba(20,16,40,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131219; --panel:#1c1a25; --ink:#ecebf3; --muted:#9a97ad; --line:#2d2a3a;
    --brand:#9a82ec; --brand-ink:#130f22; --brand-soft:#2a2440;
    --ok:#4cc38a; --ok-soft:#173226; --warn:#e0a84a; --warn-soft:#352a14; --bad:#f07070; --bad-soft:#3a1c1c;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#131219; --panel:#1c1a25; --ink:#ecebf3; --muted:#9a97ad; --line:#2d2a3a;
  --brand:#9a82ec; --brand-ink:#130f22; --brand-soft:#2a2440;
  --ok:#4cc38a; --ok-soft:#173226; --warn:#e0a84a; --warn-soft:#352a14; --bad:#f07070; --bad-soft:#3a1c1c;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
h1,h2,h3{margin:0;line-height:1.25}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo i{width:26px;height:26px;border-radius:7px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:13px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 53px)}
.side{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px}
.side .ev-pick{margin:0 6px 14px;width:calc(100% - 12px)}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;cursor:pointer}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav .sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 10px 6px}
main{padding:24px;min-width:0}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px}

/* components */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat .k{font-size:12px;color:var(--muted);font-weight:500}
.stat .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .d{font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.badge.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.progress{height:6px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress b{display:block;height:100%;background:var(--brand);border-radius:99px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.empty{padding:32px;text-align:center;color:var(--muted)}

/* event cards */
.ev-card{overflow:hidden;cursor:pointer;transition:transform .12s}
.ev-card:hover{transform:translateY(-2px)}
.ev-cover{height:110px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;font-size:13px}
.ev-card .body{padding:14px}

/* chart */
.chart{display:flex;align-items:flex-end;gap:6px;height:160px;padding-top:10px}
.chart .bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar b{width:100%;max-width:34px;background:var(--brand);border-radius:4px 4px 0 0;min-height:2px}
.chart .bar span{font-size:10px;color:var(--muted)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,12,30,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:18px;margin-bottom:14px}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}

/* public page */
.pub{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.pub-hero{border-radius:16px;padding:40px 28px;color:#fff;margin-bottom:22px}
.pub-hero h1{font-size:32px;margin:8px 0}
.pub-grid{display:grid;grid-template-columns:1fr 360px;gap:20px;align-items:start}
.tkt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tkt:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px}
.stepper button{border:0;background:none;width:30px;height:30px;cursor:pointer;font-size:16px}
.stepper span{min-width:22px;text-align:center;font-weight:600}
.powered{text-align:center;margin-top:28px;font-size:12px;color:var(--muted)}

/* checkout */
.zp-head{display:flex;align-items:center;gap:10px;margin:-22px -22px 16px;padding:14px 22px;background:#0f7a53;color:#fff;border-radius:14px 14px 0 0}
.rail{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.rail.on{border-color:#0f7a53;box-shadow:0 0 0 3px rgba(15,122,83,.15)}
.rail .ic{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:#0f7a53;border-radius:50%;animation:sp 0.8s linear infinite;margin:10px auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ticket */
.ticket{display:flex;border:1px dashed var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px;background:var(--panel)}
.ticket .l{flex:1;padding:14px}
.ticket .r{padding:10px;border-left:1px dashed var(--line);display:grid;place-items:center;background:#fff}
.ticket .r svg{display:block;width:96px;height:96px}

/* check-in */
.scan-res{padding:22px;border-radius:12px;text-align:center;font-weight:600}
.scan-res.ok{background:var(--ok-soft);color:var(--ok)}
.scan-res.bad{background:var(--bad-soft);color:var(--bad)}
.scan-res.warn{background:var(--warn-soft);color:var(--warn)}
.scan-res .big{font-size:22px}
video{width:100%;border-radius:10px;background:#000;max-height:260px;object-fit:cover}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);padding:10px}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav .sec{display:none}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2,.pub-grid{grid-template-columns:1fr}
  main{padding:16px}
  .topbar .hide-sm{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><i>hi</i><span class="hide-sm">Events</span> <span class="badge brand">Zoorya Pay · ETB</span></div>
  <div class="spacer"></div>
  <div class="seg">
    <button id="modeOrg" class="on" onclick="go('dashboard')">Organizer</button>
    <button id="modePub" onclick="go('public')">Event page</button>
    <button id="modeHome" onclick="go('orghome')">Organizer page</button>
  </div>
  <button class="btn sm hide-sm" onclick="resetDemo()" title="Reset demo data">Reset</button>
</div>

<div id="orgView" class="app">
  <aside class="side">
    <select id="evPick" class="input ev-pick" onchange="S.currentEvent=this.value;save();render()"></select>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main id="main"></main>
</div>

<div id="pubView" class="hidden"></div>
<div id="modalRoot"></div>
<div id="toast"></div>

  if (loadedFonts.has(name)) return;

  link.href = 'https://fonts.googleapis.com/css2?family=' + name.replace(/ /g, '+') + ':wght@400;600;700&display=swap';

function luminance(hex) {
  hex = String(hex || '#ffffff').replace('#', '');
  const r = parseInt(hex.substr(0, 2), 16) || 0, g = parseInt(hex.substr(2, 2), 16) || 0, b = parseInt(hex.substr(4, 2), 16) || 0;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

    const refundable = o.total > 0 && o.items.some(i => (i.refundedQty || 0) < i.qty) && o.status !== 'refunded';
    return `<tr><td><b>${o.id}</b><div class="muted small">${fmtDate(o.created)}</div></td><td>${esc(o.buyer)}<div class="muted small">${esc(o.email)}</div></td>
    <td>${o.items.map(i => `${i.qty}× ${esc(i.name)}${i.refundedQty ? ` <span class="small muted">(${i.refundedQty} refunded)</span>` : ''}`).join('<br>')}</td><td>${railBadge(o.rail)}<div class="muted small">${o.txRef}</div></td>
    <td class="num">${birr(net)}</td><td><span class="badge ${tone(o.status)}">${label(o.status)}</span></td>
    ${actions ? `<td class="num">${refundable ? `<button class="btn sm danger" onclick="refund('${o.id}')">Refund</button>` : ''}</td>` : ''}</tr>`;
  }).join('')}</table></div>`;
}
const railBadge = (r) => `<span class="badge">${r}</span>`;
function ordersView() {

  return `<div class="page-h"><h1>Orders</h1><span class="badge">${list.length}</span><div class="spacer"></div><button class="btn" onclick="exportCSV('orders')">Export CSV</button></div><div class="card">${orderTable(list)}</div>`;
}
let refundQtys = [];
function refund(id) {
  const o = S.orders.find(x => x.id === id);
  refundQtys = o.items.map(() => 0);
  const rows = o.items.map((it, i) => {
    const remaining = it.qty - (it.refundedQty || 0);
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)">
      <div><b>${esc(it.name)}</b><div class="small muted">${remaining} of ${it.qty} refundable · ${birr(it.price)} each</div></div><div class="spacer"></div>
      <div class="stepper"><button onclick="adjRefundQty('${id}',${i},-1)">−</button><span id="rq${i}">0</span><button onclick="adjRefundQty('${id}',${i},1)">+</button></div>
    </div>`;
  }).join('');
  modal(`<h2>Refund ${o.id}</h2><p class="muted">Choose how many of each ticket to refund. The amount is debited from your Zoorya Pay wallet and returned to <b>${esc(o.buyer)}</b> via ${o.rail}; the matching ticket(s) are cancelled.</p>
  ${rows}
  <div class="row" style="margin-top:12px"><b>Refund total</b><div class="spacer"></div><b id="refundTotal">${birr(0)}</b></div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="refundBtn" disabled onclick="doRefund('${id}')">Issue refund</button></div>`);
}
function adjRefundQty(id, i, d) {
  const o = S.orders.find(x => x.id === id), it = o.items[i], remaining = it.qty - (it.refundedQty || 0);
  refundQtys[i] = Math.max(0, Math.min(remaining, refundQtys[i] + d));
  document.getElementById('rq' + i).textContent = refundQtys[i];
  const total = o.items.reduce((s, x, idx) => s + x.price * refundQtys[idx], 0);
  document.getElementById('refundTotal').textContent = birr(total);
  document.getElementById('refundBtn').disabled = total <= 0;
}
function doRefund(id) {
  const o = S.orders.find(x => x.id === id);
  let amount = 0;
  o.items.forEach((it, i) => {
    const q = refundQtys[i] || 0; if (q <= 0) return;
    amount += q * it.price; it.refundedQty = (it.refundedQty || 0) + q;
    S.attendees.filter(a => a.orderId === id && a.ticketId === it.ticketId && a.status === 'active').slice(0, q).forEach(a => { a.status = 'cancelled'; });
  });
  o.refundedAmount = (o.refundedAmount || 0) + amount;
  const fullyRefunded = o.items.every(it => (it.refundedQty || 0) >= it.qty);
  o.status = fullyRefunded ? 'refunded' : (o.refundedAmount > 0 ? 'partially_refunded' : o.status);
  save(); closeModal(); render(); toast(`Refunded ${birr(amount)} to ${o.buyer}`);
}

let lastScan = null, camStream = null, camTimer = null;
function ensureDoors(e) { if (!e.doors || !e.doors.length) e.doors = [{id: 'D1', name: 'Main entrance', types: []}]; return e.doors; }
function doorAllows(door, ticketId) { return !door.types || !door.types.length || door.types.includes(ticketId); }
function checkinView() {
  const e = ev(), doors = ensureDoors(e);
  if (!curDoor || !doors.some(d => d.id === curDoor)) curDoor = doors[0].id;
  const door = doors.find(d => d.id === curDoor);
  const at = evAttendees(e).filter(a => a.status === 'active' && doorAllows(door, a.ticketId));
  const chk = at.filter(a => a.checkedIn).length;
  const log = S.scanLog.filter(l => l.eventId === e.id && l.doorId === curDoor).slice(0, 8);
  let res = '<div class="scan-res" style="background:var(--bg);color:var(--muted)">Scan a ticket QR or type its code</div>';
  if (lastScan) {
    const a = S.attendees.find(x => x.id === lastScan.aid);
    if (lastScan.kind === 'ok') res = `<div class="scan-res ok"><div class="big">✓ Checked in</div><div>${esc(a.name)} · ${esc(a.ticket)}</div><button class="btn sm" style="margin-top:10px" onclick="undoCheckin('${a.id}')">Undo</button></div>`;
    if (lastScan.kind === 'dup') res = `<div class="scan-res warn"><div class="big">⚠ Already used</div><div>${esc(a.name)} · checked in at ${fmtTime(a.checkedIn)}</div></div>`;
    if (lastScan.kind === 'cancelled') res = `<div class="scan-res bad"><div class="big">✕ Ticket cancelled</div><div>${esc(a.name)} · order refunded</div></div>`;
    if (lastScan.kind === 'wrong') res = `<div class="scan-res bad"><div class="big">✕ Wrong event</div><div>This ticket is for another event</div></div>`;
    if (lastScan.kind === 'wrongdoor') res = `<div class="scan-res warn"><div class="big">⚠ Wrong door</div><div>${esc(a.name)} · ${esc(a.ticket)} isn't valid at ${esc(door.name)}</div></div>`;
    if (lastScan.kind === 'none') res = `<div class="scan-res bad"><div class="big">✕ Invalid ticket</div><div>No ticket matches “${esc(lastScan.code)}”</div></div>`;
  }
  return `<div class="page-h"><h1>Check-in</h1><div class="spacer"></div>
    <div class="seg">${doors.map(d => `<button class="${d.id === curDoor ? 'on' : ''}" onclick="curDoor='${d.id}';lastScan=null;render()">${esc(d.name)}</button>`).join('')}</div>
    <button class="btn sm" onclick="doorModal()">+ Door</button></div>
  <div class="grid g2">
    <div class="card pad">
      <div class="row" style="margin-bottom:12px"><input id="scanInput" class="input" placeholder="TKT-XXXXXX" onkeydown="if(event.key==='Enter')doScan(this.value)"><button class="btn primary" onclick="doScan(val('scanInput'))">Check in</button></div>
      <div class="row" style="margin-bottom:12px"><button class="btn" id="camBtn" onclick="toggleCamera()">📷 Scan with camera</button><button class="btn" onclick="randomScan()">Simulate a scan</button></div>
      <video id="cam" class="hidden" playsinline muted></video>
      <div id="scanRes">${res}</div>
    </div>
    <div>
      <div class="grid g2">${stat('Checked in', chk, `of ${at.length} at ${door.name}`)}${stat('Remaining', at.length - chk, 'still to arrive')}</div>
      <div class="progress" style="margin:14px 0;height:10px"><b style="width:${at.length ? chk / at.length * 100 : 0}%"></b></div>
      <div class="card"><h3 style="padding:14px 16px 0">Scan log — ${esc(door.name)}</h3>
      ${log.length ? `<table>${log.map(l => `<tr><td class="small">${fmtTime(l.at)}</td><td>${esc(l.name)}</td><td><span class="badge ${l.kind === 'ok' ? 'ok' : (l.kind === 'dup' || l.kind === 'wrongdoor') ? 'warn' : 'bad'}">${{ok:'admitted', dup:'duplicate', cancelled:'cancelled', wrong:'wrong event', wrongdoor:'wrong door', none:'invalid', undo:'undone'}[l.kind]}</span></td></tr>`).join('')}</table>` : '<div class="empty">No scans yet</div>'}</div>
    </div>
  </div>`;
}
function doScan(raw) {
  const code = String(raw || '').trim().toUpperCase();
  if (!code) return;
  const e = ev(), doors = ensureDoors(e), door = doors.find(d => d.id === curDoor) || doors[0];
  const a = S.attendees.find(x => x.code === code);
  let kind;
  if (!a) kind = 'none';
  else if (a.eventId !== e.id) kind = 'wrong';
  else if (a.status === 'cancelled') kind = 'cancelled';
  else if (!doorAllows(door, a.ticketId)) kind = 'wrongdoor';
  else if (a.checkedIn) kind = 'dup';
  else { kind = 'ok'; a.checkedIn = Date.now(); }
  lastScan = {kind, aid: a?.id, code};
  S.scanLog.unshift({at: Date.now(), eventId: e.id, doorId: curDoor, name: a ? a.name : code, kind});
  save(); render();
}
function undoCheckin(id) {
  const a = S.attendees.find(x => x.id === id); a.checkedIn = null; lastScan = null;
  S.scanLog.unshift({at: Date.now(), eventId: ev().id, doorId: curDoor, name: a.name, kind: 'undo'});
  save(); render(); toast('Check-in undone');
}
function randomScan() {
  const pool = evAttendees(ev());
  const r = Math.random();
  const pick = r < .12 ? {code: 'TKT-FAKE01'} : r < .3 ? pool.find(a => a.checkedIn) : pool.find(a => !a.checkedIn && a.status === 'active');
  doScan((pick || pool[0]).code);
}

async function toggleCamera() {
  if (camStream) return stopCamera(true);
  if (!('BarcodeDetector' in window)) return toast('Camera QR scanning needs Chrome/Edge (BarcodeDetector). Type the code instead.');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
    const v = document.getElementById('cam'); v.srcObject = camStream; v.classList.remove('hidden'); await v.play();
    document.getElementById('camBtn').textContent = '■ Stop camera';
    const det = new BarcodeDetector({formats: ['qr_code']});
    camTimer = setInterval(async () => {
      const codes = await det.detect(v).catch(() => []);
      if (codes.length) { const c = codes[0].rawValue; stopCamera(); doScan(c); }
    }, 400);
  } catch (err) { toast('Camera unavailable: ' + err.message); stopCamera(); }
}
function stopCamera(rerender) {
  clearInterval(camTimer); camTimer = null;
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null;
  if (rerender) render();
}

function cart(tid, d) {
  const t = ev().tickets.find(x => x.id === tid), left = t.qty - sold(tid);
  const min = t.minPerOrder || 1, max = Math.min(t.maxPerOrder || 10, left);
  let q = pubCart[tid] || 0;
  if (d > 0) q = q === 0 ? min : q + d;
  else q = q <= min ? 0 : q + d;
  pubCart[tid] = Math.max(0, Math.min(max, q));
  renderPublic();
}

function takenSeats(tid) {

}
function stopHoldTimer() { clearInterval(holdTimer); holdTimer = null; holdRemaining = 0; }
function startHoldTimer(tid) {

    holdRemaining--;
    const el = document.getElementById('holdClock');
    if (el) el.textContent = Math.floor(holdRemaining / 60) + ':' + String(holdRemaining % 60).padStart(2, '0');
    if (holdRemaining <= 0) {
      stopHoldTimer(); const had = pubSeats[tid] && pubSeats[tid].length;
      pubSeats[tid] = []; delete pubCart[tid];

function seatMapModal(tid) {

      }).join('')}
    </div>`).join('');

      <span class="small"><span style="display:inline-block;width:10px;height:10px;background:var(--panel);border:1px solid var(--line);border-radius:3px;margin-right:4px"></span>Available</span>

function toggleSeat(tid, sid) {
  const tk = ev().tickets.find(x => x.id === tid);
  const list = pubSeats[tid] = pubSeats[tid] || [];
  const i = list.indexOf(sid);
  if (i >= 0) list.splice(i, 1);
  else {
    const left = tk.qty - sold(tid);
    if (list.length >= Math.min(tk.maxPerOrder, left)) return toast(`Max ${tk.maxPerOrder} seats per order`);
    list.push(sid);
  }
  if (list.length) startHoldTimer(tid); else stopHoldTimer();
  seatMapModal(tid);

  const e = ev(); let rows;
  if (kind === 'orders') rows = [['Order', 'Buyer', 'Email', 'Tickets', 'Total ETB', 'Rail', 'Tx ref', 'Status', 'Date'], ...evOrders(e).map(o => [o.id, o.buyer, o.email, o.items.map(i => i.qty + 'x ' + i.name).join('; '), o.total, o.rail, o.txRef, o.status, new Date(o.created).toISOString()])];
  else rows = [['Name', 'Email', 'Ticket', 'Code', 'Order', 'Status', 'Checked in'], ...evAttendees(e).map(a => [a.name, a.email, a.ticket, a.code, a.orderId, a.status, a.checkedIn ? new Date(a.checkedIn).toISOString() : ''])];
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const link = document.createElement('a'); link.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})); link.download = `${slug(e.name)}-${kind}.csv`; link.click();
}

route = location.hash.slice(1) || 'dashboard';
render();
</script>
</body>
